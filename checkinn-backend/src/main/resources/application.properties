# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/checkinn_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Inventory Seeding
checkinn.inventory.seed-enabled=${CHECKINN_INVENTORY_SEED_ENABLED:true}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# JWT Authentication
jwt.secret=${JWT_SECRET:local-development-secret-key-must-be-at-least-32-bytes-long}

# CORS / Frontend Configuration
frontend.url=${FRONTEND_URL:http://localhost:5173}
