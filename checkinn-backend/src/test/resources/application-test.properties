# Test Profile Configuration for CheckInn Backend

# In-Memory H2 Database in PostgreSQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:checkinn_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway Schema Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate Validation against Migrated Schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Inventory Seeding disabled in test
checkinn.inventory.seed-enabled=false

# Mock/Test Mail Configuration
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

# Test JWT Secret Key (>= 32 bytes)
jwt.secret=ci-test-secret-key-must-be-at-least-32-bytes-long

# Test Frontend URL
frontend.url=http://localhost:5173
